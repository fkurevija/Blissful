[pytest]
# Run from the repository root: py -3.11 -m pytest -q
# All application modules are imported as extend.*, rooted at Blissful/.
pythonpath = Blissful
testpaths = Blissful/tests

# extend/test_api.py and extend/test_setup.py are manual check scripts driven
# by their own main(); they set __test__ = False and are not pytest modules.
norecursedirs = .git .pytest_cache __pycache__ Blissful/extend Blissful/unused
