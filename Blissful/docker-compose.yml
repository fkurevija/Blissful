# Blissful + PO-token provider.
#
# YouTube AND YouTube Music 403s are fixed automatically when building from
# this repo: the image bakes in Deno 2.x, yt-dlp>=2026.10.26 and
# bgutil-ytdlp-pot-provider>=2.0.2, and the blissful-pot sidecar runs on the
# SAME Docker network at http://blissful-pot:4416 (no published host port).
#
# Using an image you published from this fork instead? See the commented `image:` line and
# run scripts/setup-ytdlp-runtime.sh once against your persistent downloads dir.

services:
  blissful:
    # Default: build the self-contained image from this repository.
    build: .

    # Alternative: comment out `build: .` above and uncomment the line below
    # to use the image published by GitHub Actions from this fork. It contains
    # the same Deno + PO-token runtime; only older images need the bootstrap
    # script (see its header).
    # image: fkurevija/blissful:latest

    container_name: blissful

    # The entrypoint starts as root only to fix ownership of the bind mounts,
    # then drops to PUID:PGID (default 1000:1000, as in the verified stack).
    # To pin the user in Compose instead, add: user: "1000:1000"
    ports:
      - "7373:7373"

    # PO-token provider must be up first; both containers share a network.
    depends_on:
      - blissful-pot

    volumes:
      # Configuration file (created on first run)
      - ./config.json:/app/config.json

      # Persistent downloads, pylib, Deno bootstrap and yt-dlp.conf
      - ./downloads:/app/downloads

      # yt-dlp config: Deno runtime + sidecar URL (read-only by design).
      # Override by editing the host copy.
      - ./yt-dlp.conf:/app/downloads/yt-dlp.conf:ro

      # Published-image users: uncomment to run the bootstrap in-container.
      # - ./scripts/setup-ytdlp-runtime.sh:/app/scripts/setup-ytdlp-runtime.sh:ro

      # Music library location (adjust to match your Lidarr root folder)
      # Verified deployment mount:
      - /mnt/Storage/Music:/media/Music

    environment:
      - TZ=America/Toronto
      - PORT=7373
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/downloads/pylib
      - YT_DLP_HOME=/app/downloads
      # Set by the Dockerfile for repo builds; the bootstrap script writes the
      # local path into yt-dlp.conf when using the published image.
      # - DENO_PATH=/app/downloads/deno
      - POT_PROVIDER_URL=http://blissful-pot:4416

      # Optional: Lidarr connection (can also be set in the web UI)
      # - LIDARR_URL=http://lidarr:8686
      # - LIDARR_API_KEY=your-api-key-here

      # Optional: request system (can also be set in the web UI)
      # - JELLYFIN_URL=http://jellyfin:8096
      # - JELLYFIN_API_KEY=your-jellyfin-api-key
      # - EMBY_URL=http://emby:8096
      # - EMBY_API_KEY=your-emby-api-key
      # - PLEX_URL=http://plex:32400

    networks:
      - blissful-network
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:7373/api/health\", timeout=5)' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PO-token provider sidecar. Same network as blissful, NO host port.
  # This is what makes YouTube / YouTube Music stop returning 403s.
  blissful-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: blissful-pot
    environment:
      - TZ=America/Toronto
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - POT_PROVIDER_URL=http://blissful-pot:4416
    networks:
      - blissful-network
    restart: unless-stopped
    # Intentionally no `ports:` - only reachable from the compose network.

# Optional: Add Lidarr service if not already running
# Uncomment below if you want to run Lidarr in Docker too
#
#  lidarr:
