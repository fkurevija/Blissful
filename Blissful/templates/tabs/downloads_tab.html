<!-- Tab: Download queue and history -->
<div id="downloads-tab" class="tab-content">
    <div class="card">
        <h2>📥 Downloads</h2>
        <p class="info-text">
            Jobs created by gap-fill, failed-import recovery and album downloads. Refresh
            manually or wait for the automatic 5-second refresh while this tab is open.
        </p>
        <div class="actions">
            <button type="button" class="btn btn-secondary" id="refreshJobs">🔄 Refresh</button>
            <label><input type="checkbox" id="autoRefreshJobs" checked> Auto-refresh</label>
        </div>
        <div id="jobsSummary" class="jobs-summary">Loading…</div>
        <div id="jobsList" class="jobs-list"></div>
    </div>
</div>

<style>
.jobs-summary { display: flex; gap: 18px; flex-wrap: wrap; margin: 12px 0; color: var(--muted-foreground); font-size: 13px; }
.jobs-list { max-height: 520px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
.jobs-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.jobs-table th { position: sticky; top: 0; background: #1f2937; text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
.jobs-table th:hover { color: var(--foreground); }
.jobs-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.jobs-table tr:last-child td { border-bottom: none; }
.job-status { text-transform: capitalize; font-weight: 600; }
.job-status[data-status="succeeded"] { color: #10b981; }
.job-status[data-status="failed"] { color: #ef4444; }
.job-status[data-status="running"] { color: #f59e0b; }
.job-reason { max-width: 340px; color: var(--muted-foreground); word-break: break-word; }
.wanted-toast-link { margin-left: 10px; background: transparent; border: 1px solid rgba(255,255,255,0.6); color: #fff; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px; }
.wanted-toast-link:hover { background: rgba(255,255,255,0.15); }
</style>
