<!-- Tab: Download queue and history -->
<div id="downloads-tab" class="tab-content">
    <div class="card">
        <h2>📥 Downloads</h2>
        <p class="info-text">
            Jobs created by gap-fill, failed-import recovery and album downloads. Refresh
            manually or wait for the automatic 5-second refresh while this tab is open.
        </p>
        <div class="actions">
            <button type="button" class="btn btn-secondary" id="refreshJobs">🔄 Refresh</button>
            <label><input type="checkbox" id="autoRefreshJobs" checked> Auto-refresh</label>
        </div>
        <div id="jobsSummary" class="jobs-summary">Loading…</div>
        <div class="failed-tracks">
            <div class="job-detail-heading">Failed tracks</div>
            <div id="failedTracksList" class="failed-tracks-list"></div>
        </div>
        <div id="jobsList" class="jobs-list"></div>
    </div>
</div>
