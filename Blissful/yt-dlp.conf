# yt-dlp config for Blissful (repo-built image).
#
# These are DEFAULTS, not hard requirements. Command-line options always win
# over this file, and you can point yt-dlp at a different file with
# --config-location. In Docker this file is mounted read-only from the host,
# so edit the host copy (or re-run scripts/setup-ytdlp-runtime.sh with
# FORCE_CONF=1) to override the values below.
#
# `blissful-pot` is the PO-token provider sidecar in docker-compose.yml.
# It publishes NO host port; it is reached by Docker service name over the
# shared compose network at http://blissful-pot:4416.

# Deno 2.x JS runtime used by yt-dlp for YouTube's JS challenges.
# The repo-built image installs Deno here; the published-image bootstrap
# installs it under YT_DLP_HOME instead.
--js-runtimes deno:/usr/local/bin/deno

# bgutil-ytdlp-pot-provider HTTP extractor args (service name: blissful-pot).
--extractor-args youtubepot-bgutilhttp:base_url=http://blissful-pot:4416

# Optional: allow yt-dlp to download EJS challenge solver scripts from GitHub.
# Current yt-dlp logs an EJS warning without this; PO tokens alone do not
# replace the JS challenge solver. Enable if YouTube downloads still fail.
# --remote-components ejs:github
